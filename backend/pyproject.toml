[project]
name = "spherex-time-machine-api"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live IRSA/CDS services (run with -m network)"]
addopts = "-m 'not network'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
